version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: olympic-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: olympic_sport_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d olympic_sport_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: olympic-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migration:
    image: migrate/migrate:v4.17.0
    container_name: olympic-migration
    volumes:
      - ./migrations:/migrations
    command: -path=/migrations -database=postgres://postgres:postgres@postgres:5432/olympic_sport_db?sslmode=disable up
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    container_name: olympic-app
    ports:
      - "8080:8080"
    environment:
      APP_ENV: production
      LOG_LEVEL: info
      SERVER_PORT: 8080
      SERVER_MODE: release
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: olympic_sport_db
      POSTGRES_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      JWT_SECRET: supersecretjwtkeyforolympicsports
      HMAC_SECRET: supersecrethmacsigningkeyforqrcodes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
